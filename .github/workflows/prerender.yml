# DISABLED MANUALLY 2026-07-09 — DO NOT RE-ENABLE WITHOUT READING THIS.
#
# Why: this workflow propagated corrupted content into blog posts. 7401937 was the
# damaging commit; b5a91ef ("revert: undo prerender-bot re-poisoning") restored 16 files
# by hand. The word "re-poisoning" indicates it had happened at least once before.
#
# The root cause was never diagnosed. No commit fixes build.js, and this workflow's last
# run succeeded, so the same code that produced the corruption is still on disk. Turning
# the workflow off stopped it happening unattended; it did not fix anything.
#
# Consequence: posts/*.json is the source and blog/<slug>/index.html is what a visitor
# loads, so publishing normally depends on this build. With it off, articles are
# hand-built per CCA_Weekly_Publish_Manual_2026-08-11.md.
#
# Verified 2026-08-12: build.js only READS posts/*.json. Six fs.writeFileSync targets,
# all generated output, no fs.copy/rename/unlink. The corruption could never have reached
# source, which is why 16 files could be reverted by hand.
#
# RE-ENTRY CONDITION — all three, in order:
#   1. Reproduce or rule out the corruption by running `node build.js` inside a throwaway
#      worktree (`git worktree add /tmp/cca-buildtest HEAD`), never in the working tree,
#      and diff the output. Article content changing = still broken.
#   2. Port every hand-edit to built HTML that has no posts/*.json backing into the JSON,
#      or a build will silently destroy it. 71b289c is one known case; the inventory is
#      incomplete.
#   3. Populate POST_TOPICS — 20 of 39 slugs are missing, so relatedPosts() collapses
#      them into one undefined bucket and Related Articles is topic-blind for over half
#      the site.
#
# Owner: repo owner. Re-enabling is a deliberate decision, not a cleanup task.

name: Pre-render static HTML

# Runs automatically when schema.json or build.js changes.
# Also available on demand via the Actions tab → "Run workflow".
on:
  push:
    branches: [master]
    paths:
      - 'schema.json'
      - 'build.js'
      - 'posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build.js
        run: node build.js

      - name: Commit pre-rendered HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html \
                  cca-foundations-exam/index.html \
                  cca-practice-questions/index.html \
                  cca-exam-guide/index.html \
                  sitemap.xml \
                  blog/
          git diff --staged --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: pre-render static HTML [skip ci]"
          git push

      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow-submit.js
